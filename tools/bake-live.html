<!DOCTYPE html>
<!-- One card's art for tools/bake-live.mjs: photographed without its moving parts and characters (the base), whole (to cut the characters from), and each character alone (its outline); its ambient moving parts cut out as sprites. -->
<html><head><meta charset="utf-8"><title>bake live</title>
<style>
html, body { margin: 0; background: transparent; overflow: hidden; }
#a, #a svg { display: block; width: 100vw; height: 100vh; }
#a .rise, #a .float, #a .twinkle, #a .drift, #a .breathe, #a .fall, #a .sway, #a .turn { visibility: hidden; }
</style>
</head><body><div id="a"></div><div id="b"></div>
<script type="module">
import { artSVG } from '../js/art/index.js';
import { SCENES } from '../js/art/scenes.js';
import { W, H } from '../js/art/kit.js';
import { gatherAlive } from '../js/art/alive.js';
import { PUPPETS } from '../js/art/puppets.js';
window.ids = Object.keys(SCENES);
window.size = [W, H];
const painted = () => new Promise((done) => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(done, 150))));

// The card drawn, its characters gathered (js/art/alive.js): each one's
// kind, box (in the drawing's units) and moment in its breath.
let groups = [];
window.prep = (id) => {
  const a = document.getElementById('a');
  a.innerHTML = artSVG(id) || '';
  groups = gatherAlive(a.querySelector('svg'), id);
  return groups.map(({ g, kind, box }) => ({ kind, box: { x: box.x, y: box.y, w: box.width, h: box.height }, d: parseFloat(g.style.getPropertyValue('--d')) || 0 }));
};
// What to photograph: 'base' (no characters), 'full' (all of it), or 'alpha'
// (character k alone on nothing: its outline, glow and all). Ambient moving
// parts never (they're sprites of their own).
window.view = (mode, k = 0) => {
  const svg = document.querySelector('#a svg');
  for (const el of svg.children) {
    const i = groups.findIndex((x) => x.g === el);
    el.style.visibility = mode === 'base' ? (i >= 0 ? 'hidden' : '') : mode === 'full' ? '' : (i === k || el.tagName === 'defs' ? '' : 'hidden');
  }
  return painted();
};

// ── puppets (js/art/puppets.js): a card's parts, each cut from the finished art
// Each part's source (a set of the drawing's elements) is photographed with
// everything drawn after it hidden (F), without it as well (B), and alone (its
// coverage, A): its colours, (F - B(1 - A)) / A, are complete even where
// something in front covered them. 'base' is the picture under all the parts.
let pup = null;
const NS = 'http://www.w3.org/2000/svg';
window.prepPuppet = (id) => {
  const spec = PUPPETS[id];
  if (!spec) return null;
  const a = document.getElementById('a');
  a.innerHTML = artSVG(id) || '';
  const svg = a.querySelector('svg');
  let groups = null;
  // A source: the elements to hide to take it out of the picture (`hide`), and
  // to show (with `dim` hidden) to see it alone. Keys (js/art/puppets.js):
  //   'fig:N'            the Nth figure
  //   'fig:N selector'   the pieces of figure N's own drawing (in its defs) that
  //                      the selector picks: hidden there, they leave all of the
  //                      figure's layers at once (rim, fill, glow)
  //   'alive:N - sel'    the Nth character (js/art/alive.js) without what sel picks
  //   any selector       those elements
  // or a list of keys (all of them together).
  const one = (key) => {
    let m = key.match(/^fig:(\d+)\s+(.+)$/);
    if (m) {
      const fig = svg.querySelectorAll('g.fig')[+m[1]];
      const ref = fig && svg.querySelector(fig.querySelector('use')?.getAttribute('href') || 'none');
      if (!ref) return { hide: [], show: [], dim: [] };
      const picked = [...ref.querySelectorAll(m[2])];
      return { hide: picked, show: [fig], dim: [...ref.children].filter((el) => !picked.includes(el) && !picked.some((x) => el.contains(x))) };
    }
    if (/^fig:\d+$/.test(key)) { const f = svg.querySelectorAll('g.fig')[+key.slice(4)]; return f ? { hide: [f], show: [f], dim: [] } : { hide: [], show: [], dim: [] }; }
    m = key.match(/^alive:(\d+)(?:\s*-\s*(.+))?$/);
    if (m) {
      groups ??= gatherAlive(svg, id);
      const g = groups[+m[1]]?.g, els = g ? [...g.children].filter((el) => !(m[2] && el.matches(m[2]))) : [];
      return { hide: els, show: els, dim: [] };
    }
    const els = [...svg.querySelectorAll(key)];
    return { hide: els, show: els, dim: [] };
  };
  const resolve = (of) => [].concat(of).map(one).reduce((x, y) => ({ hide: [...x.hide, ...y.hide], show: [...x.show, ...y.show], dim: [...x.dim, ...y.dim] }), { hide: [], show: [], dim: [] });
  const keyOf = (of) => JSON.stringify(of);
  let sources = [...new Set(spec.parts.map((p) => keyOf(p.of)))].map((key) => ({ key, ...resolve(JSON.parse(key)), cut: spec.parts.some((p) => keyOf(p.of) === key && p.cut) }));
  const all = [...svg.querySelectorAll('*')];
  sources = sources.filter((s) => s.show.length).sort((x, y) => all.indexOf(x.show[0]) - all.indexOf(y.show[0]));
  // a cut part leaves the rest of its source in the picture: the source shown
  // through a mask without the part's polygon (keeping the joint, so it never gapes)
  spec.parts.forEach((p, k) => {
    if (!p.cut) return;
    const src = sources.find((s) => s.key === keyOf(p.of));
    const mask = document.createElementNS(NS, 'mask');
    mask.setAttribute('id', `pupcut${k}`);
    mask.setAttribute('maskUnits', 'userSpaceOnUse');
    for (const [n, v] of [['x', -50], ['y', -50], ['width', 400], ['height', 310]]) mask.setAttribute(n, v);
    mask.innerHTML = `<rect x="-50" y="-50" width="400" height="310" fill="#fff"/><path d="M${p.poly.map(([x, y]) => `${x},${y}`).join('L')}Z" fill="#000"/><circle cx="${p.pivot[0]}" cy="${p.pivot[1]}" r="${p.joint || 4}" fill="#fff"/>`;
    svg.querySelector('defs').append(mask);
    src.wraps = src.show.map((el) => { const g = document.createElementNS(NS, 'g'); el.before(g); g.append(el); return g; });
    src.mask = `url(#pupcut${k})`;
  });
  pup = { svg, sources };
  return { sources: sources.map((s) => s.key), parts: spec.parts.map((p) => ({ name: p.name, src: sources.findIndex((s) => s.key === keyOf(p.of)), pivot: p.pivot, poly: p.poly || null })) };
};
// 'full', 'upto' i (sources after i hidden), 'below' i (i and after hidden),
// 'alone' i (only source i, no finish), or 'base' (the parts taken out).
window.viewPup = (mode, i = 0) => {
  const { svg, sources } = pup;
  svg.style.visibility = '';
  for (const s of sources) { for (const el of [...s.hide, ...s.show, ...s.dim]) el.style.visibility = ''; for (const w of s.wraps || []) w.removeAttribute('mask'); }
  const hide = (list) => list.forEach((s) => s.hide.forEach((el) => (el.style.visibility = 'hidden')));
  if (mode === 'alone') {
    svg.style.visibility = 'hidden';
    for (const el of sources[i].show) el.style.visibility = 'visible';
    for (const el of sources[i].dim) el.style.visibility = 'hidden';
  } else if (mode === 'upto') hide(sources.slice(i + 1));
  else if (mode === 'below') hide(sources.slice(i));
  else if (mode === 'base') for (const s of sources) { if (s.cut) for (const w of s.wraps) w.setAttribute('mask', s.mask); else hide([s]); }
  return painted();
};

// The ambient moving parts, each cut out as its own little picture (a sprite)
// with where it sits in the drawing's units, the point it turns from, and how
// it moves (js/sprites.js moves them). Each keeps the groups it sits in (their
// filters, opacity, transforms); the drawing's defs go along for them.
const MOVES = ['sway', 'turn', 'rise', 'float', 'twinkle', 'drift', 'breathe', 'fall'];
const SEL = MOVES.map((c) => `.${c}`).join(',');
const LIGHT = ['twinkle', 'rise', 'breathe', 'fall']; // these set the opacity themselves
const r1 = (v) => Math.round(v * 10) / 10;
window.live = (id) => {
  const host = document.getElementById('b');
  host.style.cssText = `position:absolute;left:0;top:0;width:${W}px;height:${H}px;visibility:hidden`;
  host.innerHTML = artSVG(id) || '';
  const svg = host.querySelector('svg');
  svg.style.cssText = `display:block;width:${W}px;height:${H}px`;
  const o = svg.getBoundingClientRect();
  const sprites = [];
  for (const el of svg.querySelectorAll(SEL)) {
    if (el.parentElement.closest(SEL)) continue; // part of a bigger moving thing
    const a = MOVES.find((c) => el.classList.contains(c));
    const b = el.getBoundingClientRect();
    if (!b.width && !b.height) continue;
    const fx = b.left - o.left, fy = b.top - o.top, fw = b.width, fh = b.height;
    const M = 4; // room for strokes, glows and soft edges
    const x = Math.floor(fx - M), y = Math.floor(fy - M), w = Math.ceil(fx + fw + M) - x, h = Math.ceil(fy + fh + M) - y;
    const st = el.getAttribute('style') || '';
    const v = (k) => { const m = st.match(new RegExp(`(?:^|;)\\s*${k}\\s*:\\s*([^;]+)`)); return m ? m[1].trim() : null; };
    let ox = fx + fw / 2, oy = a === 'sway' ? fy + fh : fy + fh / 2;
    const to = v('transform-origin');
    if (to) {
      const box = v('transform-box') === 'view-box';
      const at = (s, f0, size) => (s.endsWith('%') ? f0 + (parseFloat(s) / 100) * size : (box ? 0 : f0) + parseFloat(s));
      const [tx, ty = '50%'] = to.split(/\s+/);
      ox = at(tx, fx, fw); oy = at(ty, fy, fh);
    }
    const piece = el.cloneNode(true);
    piece.removeAttribute('class');
    piece.removeAttribute('style');
    let op = v('--o') != null ? parseFloat(v('--o')) : null;
    if (LIGHT.includes(a) && piece.hasAttribute('opacity')) { op ??= parseFloat(piece.getAttribute('opacity')); piece.removeAttribute('opacity'); }
    let frag = piece.outerHTML;
    for (let p = el.parentElement; p && p !== svg; p = p.parentElement) {
      const g = p.cloneNode(false);
      frag = g.outerHTML.replace(/<\/\w+>$/, (end) => frag + end);
    }
    const s = { a, x, y, w, h, ox: r1(((ox - x) / w) * 100), oy: r1(((oy - y) / h) * 100), svg: frag };
    if (v('--t') != null) s.t = parseFloat(v('--t'));
    if (v('--d') != null) s.d = parseFloat(v('--d'));
    if (op != null && op !== 1) s.o = r1(op * 100) / 100;
    sprites.push(s);
  }
  const defs = [...svg.querySelectorAll('defs')].map((d) => d.innerHTML).join('');
  host.innerHTML = '';
  return { defs, sprites };
};
window.ready = true;
</script>
</body></html>
